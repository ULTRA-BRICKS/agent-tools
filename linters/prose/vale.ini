# Prose baseline for `rig lint text`. Rig copies this file into its cache directory,
# runs `vale sync` there once per change, and lints Markdown drafts with it.
# Packages are pinned to release URLs so a sync is reproducible.
StylesPath = styles
MinAlertLevel = suggestion

Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip, https://github.com/vale-cli/proselint/releases/download/v0.3.4/proselint.zip, https://github.com/vale-cli/write-good/releases/download/v0.4.1/write-good.zip, https://github.com/vale-cli/readability/releases/download/v0.2.0/Readability.zip

[*.md]
BasedOnStyles = ai-tells, proselint, write-good, Readability

# Every rule turned off below exists in the pinned releases (checked after `vale sync`, 2026-09-27).
# Flags every "is"/"are"; useless on technical prose.
write-good.E-Prime = NO
# Flags every word of three or more syllables ("receiver", "Chromecast").
Readability.Polysyllables = NO
# Keep two document-level readability scores; the other five repeat the same signal.
Readability.ColemanLiau = NO
Readability.FleschReadingEase = NO
Readability.LIX = NO
Readability.SMOG = NO
Readability.AutomatedReadability = NO
