# rig.yaml — REPO-LEVEL config only.
# The machine-wide installs (skills, agent-hooks, git-hooks dispatcher, MCP, harness
# auto-mode) live in the GLOBAL layer ~/.config/rig/config.yaml and are NOT repeated here.
# This file holds only what is specific to THIS repo (CI gates, repo settings). The cascade
# is by LOCATION: global is global, this committed file is the repo and overrides it.
# Apply: rig apply.  Drift: rig status.

version: 1

# Worktree-only guard: primary checkout stays on the default branch for merge/pull/read-only
# only; all authoring happens in a separate `rig worktree create <name> --from origin/main`
# tree (not raw `git worktree add` — the rig wrapper registers the path in .git/info/exclude
# and matches this repo's required layout). Adds ONLY worktree_only on top of the global
# agent_hooks block (~/.config/rig/config.yaml, enabled/all) — does not change what hooks
# install, just gates worktree-only-writes (pre-write), pin-primary-worktree (pre-bash), and
# block-devserver-primary (pre-bash: denies `npm run dev` / `vite` on the primary checkout's
# default branch — hatch via RIG_HATCH_REQUEST_BLOCK_DEVSERVER_PRIMARY). See rig-cli AGENTS.md
# "Harness workflow guards" and the RIG_HATCH_REQUEST_WORKTREE_ONLY_WRITES /
# RIG_HATCH_REQUEST_PIN_PRIMARY_WORKTREE hatches for a deliberate one-off bypass. (Alex,
# 2026-09-07: agents were editing/branching directly in ecosystem repos' primary checkouts.)
agent_hooks:
  worktree_only: true

scripts:
  test: uv run --with pytest pytest tests/

ci:
  # enabled: is the category kill-switch; each item's own enabled: is the opt-in. Both must
  # be true for a slot to install (parent off → nothing installs regardless of items).
  enabled: true
  items:
    # The repo's own test gate (ci/tests/) — the green/red signal gh ship + the ruleset
    # wait on. Everything else in ci/ is governance and stays opt-in.
    tests: { enabled: true, tier: block }

# Explicit rules block so Rig plans Oxc policy even without stack: typescript.
# preview: true prints before/after finding counts on apply.
linters:
  enabled: true
  preview: true
  rules: {}

task:
  backend: forgejo
  forgejo:
    host: git.hyperide.ai
    repo: ultrabricks/agent-tools
    attachment_mode: link
