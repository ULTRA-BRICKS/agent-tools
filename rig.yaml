# rig.yaml — REPO-LEVEL config only.
# The machine-wide installs (skills, agent-hooks, git-hooks dispatcher, MCP, harness
# auto-mode) live in the GLOBAL layer ~/.config/rig/config.yaml and are NOT repeated here.
# This file holds only what is specific to THIS repo (CI gates, repo settings). The cascade
# is by LOCATION: global is global, this committed file is the repo and overrides it.
# Apply: rig apply.  Drift: rig status.

version: 1

scripts:
  test: uv run --with pytest pytest tests/

ci:
  # enabled: is the category kill-switch; each item's own enabled: is the opt-in. Both must
  # be true for a slot to install (parent off → nothing installs regardless of items).
  enabled: true
  items:
    # The repo's own test gate (ci/tests/) — the green/red signal gh ship + the ruleset
    # wait on. Everything else in ci/ is governance and stays opt-in.
    tests: { enabled: true, tier: block }
