[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttools-tg-inbox"
version = "0.2.0"
description = "tg-ctl Stop-hook inbox reader: omp's yield-time fallback for tg-ctl grant notices (stdlib-only)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alex Mextner" }]
keywords = ["telegram", "tg-ctl", "stop-hook", "inbox", "agent-tools"]
# Intentionally ZERO runtime dependencies — stdlib only (hashlib + json).
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://git.hyperide.ai/ultrabricks/agent-tools"

# This pyproject lives INSIDE the package directory (same layout as agenttools_tmux_inject).
[tool.setuptools]
packages = ["agenttools_tg_inbox"]

[tool.setuptools.package-dir]
agenttools_tg_inbox = "."

[tool.pytest.ini_options]
testpaths = ["../../tests"]
