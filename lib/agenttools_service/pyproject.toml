[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttools-service"
version = "0.2.0"
description = "Shared service-manager for the agent-tools ecosystem — one run/start/stop/status/enable/disable lifecycle (incl. launchd/systemd autostart) for every long-running server (stdlib-only + agenttools-daemon)."
readme = "README.md"
# 3.9 to match the lowest floor in the ecosystem (review-cli is >=3.9; rig-cli >=3.10),
# the same floor agenttools-daemon / agenttools-retry / agenttools-log target.
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alex Mextner" }]
keywords = ["service", "daemon", "launchd", "systemd", "autostart", "pidfile", "agent-tools"]
# The pidfile + start/stop/status machinery is reused from agenttools-daemon (also
# stdlib-only) rather than reimplemented. Caret-style floor so patch/minor fixes flow in.
# Everything else is stdlib (os/subprocess/socket/shutil/pathlib). See __init__.py.
dependencies = ["agenttools-daemon>=0.1,<1"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://git.hyperide.ai/ultrabricks/agent-tools"

# The package source lives one directory up (lib/agenttools_service, this file's directory is
# the package itself). Point discovery at the parent so setuptools finds the package and
# never wanders into the umbrella repo's non-Python content (skills/, ci/, …).
[tool.setuptools.packages.find]
where = [".."]
include = ["agenttools_service*"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
