[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttools-daemon"
version = "0.1.0"
description = "Dependency-free process supervisor for the agent-tools ecosystem — keeps a child alive across kills with backoff + a pidfile (stdlib-only)."
readme = "README.md"
# 3.9 to match the lowest floor in the ecosystem (review-cli is >=3.9; rig-cli >=3.10),
# the same floor agenttools-retry / agenttools-log target.
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alex Mextner" }]
keywords = ["daemon", "supervisor", "process", "pidfile", "backoff", "agent-tools"]
# Intentionally ZERO runtime dependencies — stdlib only (subprocess + os + signal + time).
# See lib/agenttools_daemon/__init__.py for the dependency rationale.
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://git.hyperide.ai/ultrabricks/agent-tools"

# The package source lives one directory up (lib/agenttools_daemon, this file's directory is
# the package itself). Point discovery at the parent so setuptools finds the package and
# never wanders into the umbrella repo's non-Python content (skills/, ci/, …).
[tool.setuptools.packages.find]
where = [".."]
include = ["agenttools_daemon*"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
