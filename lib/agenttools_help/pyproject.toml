[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttools-help"
version = "0.1.0"
description = "Shared help formatter for the agent-tools ecosystem — one colorized help layer (sections, usage line, subcommands, ACTUAL defaults, scoped subcommand options, topic-help, install-state ✓/○/⚠) reused across review/rig/tg/draw/3d/task (stdlib-only)."
readme = "README.md"
# 3.9 to match the lowest floor in the ecosystem (review-cli is >=3.9; rig-cli >=3.10),
# the same floor agenttools-service / agenttools-errors target.
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alex Mextner" }]
keywords = ["help", "cli", "argparse", "ansi-color", "topic-help", "agent-tools"]
# Intentionally ZERO runtime dependencies — stdlib only (dataclasses + os/sys/shutil/textwrap
# + optional argparse introspection). See lib/agenttools_help/__init__.py for the rationale.
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://git.hyperide.ai/ultrabricks/agent-tools"

# The package source lives one directory up (lib/agenttools_help, this file's directory is
# the package itself). Point discovery at the parent so setuptools finds the package and
# never wanders into the umbrella repo's non-Python content (skills/, ci/, …).
[tool.setuptools.packages.find]
where = [".."]
include = ["agenttools_help*"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
