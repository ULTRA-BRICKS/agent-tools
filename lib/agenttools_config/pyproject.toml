[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttools-config"
version = "0.1.0"
description = "Generalized two-layer config-cascade loader for the agent-tools ecosystem (stdlib-only at import; lazy PyYAML)."
readme = "README.md"
# 3.9 to match the lowest floor in the ecosystem (review-cli is >=3.9; rig-cli >=3.10).
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alex Mextner" }]
keywords = ["config", "cascade", "xdg", "yaml", "agent-tools"]
# PyYAML is the only runtime dep, and it's imported LAZILY (inside the loader) so importing
# the package stays stdlib-only — declared here because actually LOADING a config needs it.
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://git.hyperide.ai/ultrabricks/agent-tools"

# This pyproject lives INSIDE the package dir; the package source is this same directory.
# Point discovery one level up and filter to just this package so setuptools never bundles
# the sibling `agenttools_log` (its own distribution) or the umbrella's non-Python content.
[tool.setuptools.packages.find]
where = [".."]
include = ["agenttools_config*"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
