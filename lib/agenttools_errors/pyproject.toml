[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttools-errors"
version = "0.1.0"
description = "Shared error/exit-code layer for the agent-tools ecosystem — one structured what/why/how-to-fix error type with stable per-class exit codes, consumed by review/rig/tg/draw/3d/task (stdlib-only)."
readme = "README.md"
# 3.9 to match the lowest floor in the ecosystem (review-cli is >=3.9; rig-cli >=3.10),
# the same floor agenttools-service / agenttools-retry / agenttools-log target.
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alex Mextner" }]
keywords = ["errors", "exit-codes", "cli", "structured-errors", "agent-tools"]
# Intentionally ZERO runtime dependencies — stdlib only (dataclasses + os/sys/shutil for the
# one dependency probe). See lib/agenttools_errors/__init__.py for the dependency rationale.
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://git.hyperide.ai/ultrabricks/agent-tools"

# The package source lives one directory up (lib/agenttools_errors, this file's directory is
# the package itself). Point discovery at the parent so setuptools finds the package and
# never wanders into the umbrella repo's non-Python content (skills/, ci/, …).
[tool.setuptools.packages.find]
where = [".."]
include = ["agenttools_errors*"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
