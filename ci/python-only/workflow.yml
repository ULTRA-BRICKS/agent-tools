# python-only gate: rig-ecosystem tools are written in Python (owner decision 2026-06-14,
# restated 2026-10-17; agent-tools#945). Fails the PR when it adds or changes non-Python
# source (TypeScript/JavaScript/Go/Rust/..., node/bun scripts, shell over 40 lines) outside
# the central allowlist. The same checker runs locally as the global pre-commit fragment
# 20-python-only; this is the backstop for a missing or bypassed hook.
#
# INSTALL: rig does it from rig.yaml `ci.items.python-only` (workflow → .github/workflows/
# python-only.yml, checker → ci/python-only/python_only.py). By hand: copy both.
#
# SCOPE: the checker decides from --origin (this repo's URL); outside the rig-ecosystem tool
# repos it passes without checking. Exemptions and warn mode live in the checker's REPOS
# registry in agent-tools — change them there, then `rig apply`.
#
# TAMPER-RESISTANCE — `pull_request_target`: the trusted BASE-branch copy of the checker runs
# (a PR could otherwise edit the checker or its allowlist to pass itself). The PR head is
# fetched as a git object and read as DATA (`git diff` / `git cat-file`); nothing from it runs.
#   HARD RULE: no build/test/install step here.
#   Caveat: it does NOT run on the PR that first adds it (base has no gate yet).

name: python-only

on:
  pull_request_target:
    # `edited` re-runs the check when the PR is retargeted to another base branch.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      head_sha:
        description: 'Commit SHA to check (required for manual runs)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  python-only:
    name: python-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: python-only-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout BASE branch (trusted checker) with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # codeql[actions/untrusted-checkout/medium]
      # Justified: the PR head is fetched as a git OBJECT only — never checked out, never
      # executed; the checker reads it with git diff / git cat-file.
      - name: Fetch the PR head commit as DATA (not checked out / not executed)
        run: |
          set -euo pipefail
          # A fork's head lives in the base repo only under refs/pull/<n>/head (GitHub and
          # Forgejo); a raw-SHA fetch of it can be refused. Manual runs fetch the SHA.
          if [ -n "$PR_NUMBER" ]; then
            git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"
          else
            git fetch --no-tags origin "$HEAD_SHA"
          fi
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "::error::python-only: PR head ${HEAD_SHA} not fetched. Failing closed." >&2
            exit 1
          fi
          if ! git merge-base "origin/${BASE_REF}" "$HEAD_SHA" >/dev/null 2>&1; then
            git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" || true
            if ! git merge-base "origin/${BASE_REF}" "$HEAD_SHA" >/dev/null 2>&1; then
              echo "::error::python-only: no merge-base between origin/${BASE_REF} and the PR head. Failing closed." >&2
              exit 1
            fi
          fi

      # codeql[actions/cache-poisoning/poisonable-step]
      # Justified: runs only the trusted base-branch checker over PR content as data.
      - name: Check the PR diff for non-Python tool code
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python3 ci/python-only/python_only.py --base "origin/${BASE_REF}" --head "$HEAD_SHA" --origin "$REPO_URL"
